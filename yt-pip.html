<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YouTube</title>
  <!-- CineTab's picture in picture window (script.js) shows a YouTube video through this page: the
       window itself has no address, so YouTube's player, which needs to know which site it's on,
       wouldn't load there. script.js makes the player in #player and keeps it in step. -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
